<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Raṣāʾif — Arabic–English Parallel Corpus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,600;1,8..60,300&family=Scheherazade+New:wght@400;600&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<style>
/* ===== MOBILE SIDEBAR ===== */
.sb-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(26,22,17,.5);
  z-index: 50;
}
.sb-overlay.open { display: block; }

.sb-toggle {
  display: none;
  align-items: center; gap: 5px;
  font-family: var(--serif); font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--rule-strong);
  background: var(--paper); color: var(--ink-mid);
  cursor: pointer; border-radius: var(--r);
}
body.rtl .sb-toggle { font-family: var(--arabic); font-size: 13px; }

/* ===== CELL PREVIEW ===== */
.cell-preview {
  display: block;
  line-height: 1.75;
  word-break: break-word;
}
.cell-expand-btn {
  display: inline;
  background: none; border: none; padding: 0;
  cursor: pointer;
  font-size: 11px;
  color: var(--gold);
  font-family: var(--arabic);
  margin-right: 2px;
}
.cell-expand-btn.en {
  font-family: var(--serif);
  color: var(--ink-faint);
  font-size: 10px;
}
.cell-expand-btn:hover { text-decoration: underline; }

/* ===== SOURCE TITLE ===== */
.src-title {
  font-size: 11px; color: var(--ink-soft);
  line-height: 1.4; white-space: normal; max-width: 90px;
}
.src-title.ar {
  font-family: var(--arabic); font-size: 12px;
  direction: rtl; text-align: right;
}

/* ===== SIDEBAR META ===== */
.text-item-date {
  font-size: 10px; color: var(--ink-faint);
  font-style: italic; line-height: 1.4;
}
body.rtl .text-item-date {
  font-family: var(--arabic); font-size: 11px; font-style: normal;
}
.text-item-title.ar, .text-item-author.ar {
  font-family: var(--arabic); font-size: 14px; direction: rtl;
}
.text-item-author.ar { font-size: 11px; }

/* ===== RTL TABLE ===== */
body.rtl .ptable { direction: rtl; }
body.rtl .ptable thead th { text-align: right; }
body.rtl .td-en { direction: ltr; text-align: left; }
body.rtl .td-src { text-align: right; }
body.rtl .td-n { direction: ltr; }
.td-rel { display: none; }

/* ===== PAGINATION ===== */
.pagination {
  border-top: 1px solid var(--rule);
  padding: 12px 16px; background: var(--paper-2);
}
.pag-inner { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pag-btn {
  font-family: var(--serif); font-size: 12px; padding: 3px 9px;
  border: 1px solid var(--rule-strong); background: var(--paper);
  color: var(--ink-mid); cursor: pointer; border-radius: var(--r);
  transition: background .1s; min-width: 32px; text-align: center;
}
body.rtl .pag-btn { font-family: var(--arabic); font-size: 13px; }
.pag-btn:hover:not(:disabled):not(.active) { background: var(--paper-3); }
.pag-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pag-btn:disabled { opacity: 0.35; cursor: default; }
.pag-ellipsis { color: var(--ink-faint); padding: 0 3px; font-size: 12px; }
.pag-info { font-size: 11px; color: var(--ink-faint); margin-left: 8px; font-family: var(--mono); }
body.rtl .pag-info { font-family: var(--arabic); font-size: 12px; margin-left: 0; margin-right: 8px; }

/* ===== MOBILE ===== */
@media (max-width: 700px) {
  .sb-toggle { display: flex; }
  .sb-overlay.open { display: block; }

  /* Sidebar slides in from left (or right in RTL) */
  .sidebar {
    position: fixed !important;
    top: 0; bottom: 0; left: 0;
    width: 82vw; max-width: 300px;
    z-index: 60;
    overflow-y: auto;
    transform: translateX(-105%);
    transition: transform .22s ease;
    border-right: 2px solid var(--rule-strong) !important;
    background: var(--paper-2);
    padding-top: 10px;
  }
  body.rtl .sidebar {
    left: auto; right: 0;
    transform: translateX(105%);
    border-right: none !important;
    border-left: 2px solid var(--rule-strong) !important;
  }
  .sidebar.open { transform: translateX(0) !important; }

  /* Full width results */
  .search-layout { display: block !important; }

  /* Compact banner — show only texts + pairs */
  .corpus-banner .banner-sep:nth-child(4),
  .corpus-banner .banner-sep:nth-child(6),
  .corpus-banner .banner-stat:nth-child(5),
  .corpus-banner .banner-stat:nth-child(7) { display: none; }
  .corpus-banner { padding: 6px 12px; }

  /* Search bar */
  .searchbar { padding: 8px 10px; }
  .search-row { flex-wrap: wrap; gap: 4px; }
  #q { font-size: 16px; min-width: 0; flex: 1 1 160px; }
  .ctrl-sel { flex: 0 0 auto; }
  #view-btns { flex: 0 0 auto; }
  .filter-row { gap: 4px; }
  .morph-hint { display: none; }
  .btn-group button { font-size: 10px; padding: 3px 6px; }

  /* Table */
  .ptable { font-size: 12px; }
  .td-src { max-width: 50px; }
  .src-title { max-width: 50px; font-size: 10px; }
  .td-en, .td-ar { padding: 6px 6px !important; }
  .stats-bar { font-size: 10px; padding: 4px 10px; }

  /* Header */
  .site-header { padding: 8px 12px 6px; }
  .site-tagline { display: none; }
  .site-nav { gap: 0; }
  .nav-link { font-size: 11px; padding: 2px 6px; }
  .nav-lang-btn { margin-left: 3px; }
}

/* ── Up/Down navigation arrows ── */
.row-nav {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 2px;
  opacity: 0;
  transition: opacity .15s;
  pointer-events: none;
  z-index: 2;
}
body.rtl .row-nav { right: auto; left: 4px; }
.result-row { position: relative; }
.result-row:hover .row-nav { opacity: 1; pointer-events: all; }
.nav-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border: 1px solid var(--rule-strong);
  border-radius: 3px;
  background: var(--paper);
  color: var(--ink-faint);
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  transition: background .1s, color .1s;
  user-select: none;
}
.nav-arrow:hover { background: var(--paper-3); color: var(--ink); }
.nav-arrow:disabled { opacity: 0.3; cursor: default; }
/* Inline sibling row */
.sibling-row td {
  background: var(--paper-2);
  border-bottom: 1px dashed var(--rule);
  font-size: 12px;
  color: var(--ink-soft);
  padding: 5px 9px !important;
}
.sibling-row .td-ar { font-family: var(--arabic); font-size: 14px; }
.sibling-loading { color: var(--ink-faint); font-size: 11px; font-style: italic; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="site-brand" href="index.html">
      <span class="site-name" id="hd-name">Raṣāʾif</span>
      <span class="site-tagline" id="hd-tag">Arabic–English Parallel Corpus</span>
    </a>
    <nav class="site-nav">
      <button class="sb-toggle" id="sb-toggle-btn" onclick="toggleSidebar()">
        ☰ <span id="sb-toggle-lbl">Texts</span>
      </button>
      <a href="index.html"     class="nav-link active" id="nav-s">Search</a>
      <a href="analysis.html"  class="nav-link"        id="nav-a">Analysis</a>
      <a href="about.html"     class="nav-link"        id="nav-b">About</a>
      <a href="cite.html"      class="nav-link"        id="nav-c">Cite</a>
      <a href="lataif.html"    class="nav-link"        id="nav-l">Lāṭāʾif</a>
      <a href="aranjiyya.html" class="nav-link"        id="nav-e">al-ʿAranijiyya</a>
      <button class="nav-lang-btn" id="lang-btn" onclick="toggleLang()">العربية</button>
    </nav>
  </div>
</header>

<div class="sb-overlay" id="sb-overlay" onclick="closeSidebar()"></div>

<div class="corpus-banner">
  <div class="banner-inner">
    <div class="banner-stat">
      <span class="banner-num" id="bn-texts">25</span>
      <span class="banner-lbl" id="bn-texts-l">Texts</span>
    </div>
    <div class="banner-sep"></div>
    <div class="banner-stat">
      <span class="banner-num" id="bn-pairs">85,987</span>
      <span class="banner-lbl" id="bn-pairs-l">Sentence Pairs</span>
    </div>
    <div class="banner-sep"></div>
    <div class="banner-stat">
      <span class="banner-num" id="bn-timespan">2nd–8th c. AH</span>
      <span class="banner-lbl" id="bn-timespan-l">Timespan</span>
    </div>
    <div class="banner-sep"></div>
    <div class="banner-stat">
      <span class="banner-num" id="bn-results">—</span>
      <span class="banner-lbl" id="bn-results-l">Results</span>
    </div>
  </div>
</div>

<div class="search-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-heading">
      <span id="sb-lbl">Texts</span>
      <div class="sb-btns">
        <button class="btn-ghost" id="btn-all"  onclick="selectAll(true)">Select all</button>
        <button class="btn-ghost" id="btn-none" onclick="selectAll(false)">Clear all</button>
      </div>
    </div>
    <div id="book-list">
      <div style="font-size:12px;color:var(--ink-faint);padding:8px">
        <span class="spinner"></span><span id="load-msg"> Loading…</span>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <div class="searchbar">
      <div class="search-row">
        <input type="text" id="q" autocomplete="off" oninput="doSearch()"
               placeholder="Search in English or Arabic…">
        <select class="ctrl-sel" id="lang-sel" onchange="doSearch()">
          <option value="both" id="opt-both">Both languages</option>
          <option value="en"   id="opt-en">English only</option>
          <option value="ar"   id="opt-ar">Arabic only</option>
        </select>
        <div class="btn-group" id="view-btns">
          <button class="active" onclick="setView('parallel')" id="btn-par">Parallel table</button>
          <button onclick="setView('conc')"                    id="btn-kwic">Concordance</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label" id="lbl-match">Match:</span>
        <div class="btn-group" id="mode-btns">
          <button class="active" onclick="setMode('any')"   id="btn-any">Any order</button>
          <button onclick="setMode('exact')"                id="btn-exact">Exact phrase</button>
          <button onclick="setMode('or')"                   id="btn-or">Any word</button>
        </div>
        <label class="morph-label">
          <input type="checkbox" id="morpho" onchange="doSearch()" checked>
          <span id="lbl-morph">Morphology</span>
          <span class="morph-hint" id="morph-hint">(كاتب/كتبت = كتب · ran/shown = run/show)</span>
        </label>
        <span class="filter-label" id="lbl-excl">Exclude:</span>
        <input type="text" id="excl" oninput="doSearch()" placeholder="word or phrase…">
      </div>
    </div>

    <div class="stats-bar" id="stats-bar">Δ</div>
    <div id="results">
      <div class="msg"><span class="spinner"></span><span id="init-msg"> Loading…</span></div>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script>
let view = 'parallel', mode = 'any', currentPage = 1;

/* ── Mobile sidebar ── */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sb-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('open');
}

/* ── Language ── */
function toggleLang() { setLang(LANG === 'en' ? 'ar' : 'en'); applyI18n(); }

function applyI18n() {
  const ar = LANG === 'ar';
  document.getElementById('hd-name').textContent       = t('site_name');
  document.getElementById('hd-tag').textContent        = t('site_subtitle');
  document.getElementById('nav-s').textContent         = t('nav_search');
  document.getElementById('nav-a').textContent         = t('nav_analysis');
  document.getElementById('nav-b').textContent         = t('nav_about');
  document.getElementById('nav-c').textContent         = t('nav_cite');
  document.getElementById('nav-l').textContent         = t('nav_lataif');
  document.getElementById('nav-e').textContent         = t('nav_aranjiyya');
  document.getElementById('lang-btn').textContent      = t('toggle_lang');
  document.getElementById('sb-lbl').textContent        = t('texts_heading');
  document.getElementById('sb-toggle-lbl').textContent = t('texts_heading');
  document.getElementById('btn-all').textContent       = t('select_all');
  document.getElementById('btn-none').textContent      = t('clear_all');
  document.getElementById('opt-both').textContent      = t('lang_both');
  document.getElementById('opt-en').textContent        = t('lang_en');
  document.getElementById('opt-ar').textContent        = t('lang_ar');
  document.getElementById('btn-par').textContent       = t('output_parallel');
  document.getElementById('btn-kwic').textContent      = t('output_kwic');
  document.getElementById('lbl-match').textContent     = t('match_label') + ':';
  document.getElementById('btn-any').textContent       = t('match_order');
  document.getElementById('btn-exact').textContent     = t('match_phrase');
  document.getElementById('btn-or').textContent        = t('match_any');
  document.getElementById('lbl-morph').textContent     = t('match_morph');
  document.getElementById('morph-hint').textContent    = '(' + t('morph_hint') + ')';
  document.getElementById('lbl-excl').textContent      = t('exclude_label') + ':';
  document.getElementById('q').placeholder             = t('search_placeholder');
  document.getElementById('excl').placeholder          = t('excl_placeholder');
  document.getElementById('bn-texts-l').textContent    = t('texts_heading');
  document.getElementById('bn-pairs-l').textContent    = t('stat_pairs');
  document.getElementById('bn-timespan-l').textContent = ar ? 'الحقبة الزمنية' : 'Timespan';
  document.getElementById('bn-results-l').textContent  = ar ? 'النتائج' : 'Results';
  document.getElementById('bn-timespan').textContent   = ar ? 'ق 2–8 هـ' : '2nd–8th c. AH';
  document.getElementById('load-msg').textContent      = ' ' + t('loading');
  document.getElementById('init-msg').textContent      = ' ' + t('loading');
  renderSidebar();
}

/* ── Init ── */
async function init() {
  setLang(LANG); applyI18n();
  try {
    await RasaifEngine.loadBooks(msg => {
      document.getElementById('load-msg').textContent = ' ' + msg;
    });
    renderSidebar();
    document.getElementById('stats-bar').textContent = t('ready_msg');
    document.getElementById('results').innerHTML = `<div class="msg">${t('search_prompt')}</div>`;
  } catch(e) {
    document.getElementById('book-list').innerHTML =
      `<div style="font-size:12px;color:var(--ink-faint);padding:6px">${e.message}</div>`;
    document.getElementById('results').innerHTML = `<div class="msg">${e.message}</div>`;
  }
}

/* ── Sidebar ── */
function renderSidebar() {
  const books = RasaifEngine.books();
  if (!books.length) return;
  const ar = LANG === 'ar';
  document.getElementById('book-list').innerHTML = books.map((b, i) => {
    const m = b.meta || RasaifEngine.getMeta(b.name);
    const title  = (ar ? m.title_ar  : m.title_en)  || b.name;
    const author = (ar ? m.author_ar : m.author_en) || '';
    const date   = (ar ? m.death_label_ar : m.death_label_en) || '';
    return `<label class="text-item">
      <input type="checkbox" ${b.checked?'checked':''} onchange="toggle(${i},this.checked)">
      <div class="text-item-text">
        <div class="text-item-title ${ar?'ar':''}">${RasaifEngine.esc(title)}</div>
        <div class="text-item-author ${ar?'ar':''}">${RasaifEngine.esc(author)}</div>
        <div class="text-item-date">${RasaifEngine.esc(date)}</div>
      </div>
    </label>`;
  }).join('');
}

function toggle(i,v) { RasaifEngine.books()[i].checked=v; doSearch(); }
function selectAll(v) { RasaifEngine.books().forEach(b=>b.checked=v); renderSidebar(); doSearch(); }
function setView(v) {
  view=v;
  document.querySelectorAll('#view-btns button').forEach((b,i)=>
    b.classList.toggle('active',(i===0&&v==='parallel')||(i===1&&v==='conc')));
  doSearch();
}
function setMode(m) {
  mode=m;
  document.querySelectorAll('#mode-btns button').forEach((b,i)=>
    b.classList.toggle('active',['any','exact','or'][i]===m));
  doSearch();
}

/* ── Search ── */
let searchTimer=null;
function doSearch() { currentPage=1; clearTimeout(searchTimer); searchTimer=setTimeout(()=>_search(1),180); }
function goToPage(p) { clearTimeout(searchTimer); _search(p); }

async function _search(page) {
  const q         = (document.getElementById('q').value||'').trim();
  const excl      = document.getElementById('excl').value||'';
  const lang      = document.getElementById('lang-sel').value;
  const useMorpho = document.getElementById('morpho').checked;
  const books     = RasaifEngine.books();
  if (!books.length) return;
  if (!books.some(b=>b.checked)) {
    document.getElementById('stats-bar').textContent = t('no_texts');
    document.getElementById('results').innerHTML = `<div class="msg">${t('no_texts')}</div>`;
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('bn-results').textContent = '—';
    return;
  }
  if (!q) {
    document.getElementById('stats-bar').textContent = t('ready_msg');
    document.getElementById('results').innerHTML = `<div class="msg">${t('search_prompt')}</div>`;
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('bn-results').textContent = '—';
    return;
  }
  currentPage = page||1;
  document.getElementById('results').innerHTML =
    `<div class="msg"><span class="spinner"></span> ${t('loading')}</div>`;
  document.getElementById('pagination').innerHTML = '';

  const {hits,total,totalPages,error} =
    await RasaifEngine.search({query:q,lang,mode,useMorpho,exclude:excl,page:currentPage});

  if (error) { document.getElementById('results').innerHTML=`<div class="msg">${error}</div>`; return; }

  const ar     = LANG==='ar';
  const active = books.filter(b=>b.checked).length;
  const from   = (currentPage-1)*50+1;
  const to     = Math.min(currentPage*50,total);

  document.getElementById('bn-results').textContent = total.toLocaleString();
  let sb = total>0
    ? `${from}–${to} ${ar?'من':'of'} ${total.toLocaleString()} ${ar?'رَصيفة':'pairs'}`
    : `${ar?'لا شيء':'0 results'}`;
  sb += `  ·  «${q}»`;
  if (total>0) sb += `  ·  ${t('ranked')}`;
  sb += `  ·  ${active} ${ar?(active===1?'كتابٌ':'كتب'):'text(s) active'}`;
  document.getElementById('stats-bar').textContent = sb;

  if (!hits.length) {
    document.getElementById('results').innerHTML =
      `<div class="msg">${t('no_results')}<br><small>${t('no_results_hint')}</small></div>`;
    return;
  }

  const el = document.getElementById('results');
  if (view==='parallel') el.innerHTML = renderParallel(hits,lang,q);
  else { const lines=RasaifEngine.makeConcordance(hits,q,lang); el.innerHTML=renderKWIC(lines); }
  renderPagination(total,totalPages,currentPage);
  if (window.innerWidth<=700) closeSidebar();
}

/* ════════════════════════════════════════
   TRUNCATION — pure JavaScript word count
   Works identically for Arabic and English
   Preserves <mark> highlight tags
   Shows 25–35 words; expand button for more
   ════════════════════════════════════════ */
const PREVIEW = 30; // target preview word count

function stripTags(html) { return html.replace(/<[^>]*>/g,''); }

function truncateHTML(html, maxWords) {
  if (!html) return { preview: '', rest: '', needs: false };
  const plain = stripTags(html).trim().split(/\s+/);
  if (plain.length <= maxWords) return { preview: html, rest: '', needs: false };

  // Walk through html character by character, counting words
  let wordCount = 0;
  let i = 0;
  let cutAt = html.length;

  while (i < html.length && wordCount < maxWords) {
    if (html[i] === '<') {
      // skip tag
      while (i < html.length && html[i] !== '>') i++;
      i++; // skip '>'
    } else if (/\S/.test(html[i])) {
      // start of a word — skip to end of word
      while (i < html.length && html[i] !== '<' && /\S/.test(html[i])) i++;
      wordCount++;
      if (wordCount === maxWords) { cutAt = i; }
    } else {
      i++; // whitespace
    }
  }

  const preview = html.slice(0, cutAt).trimEnd();
  const rest    = html.slice(cutAt).trimStart();
  return { preview, rest, needs: true };
}

/* ── Render parallel table ── */
function renderParallel(hits, lang, q) {
  const ar     = LANG==='ar';
  const showAr = lang!=='en';
  const showEn = lang!=='ar';
  // In RTL mode swap Arabic/English column order
  let h = `<table class="ptable"><thead><tr>
    <th>#</th><th>${t('col_source')}</th>
    ${ar && showAr ? `<th class="th-ar">${t('col_ar')}</th>` : ''}
    ${ar && showAr && showEn ? '<th class="td-dot"></th>' : ''}
    ${showEn?`<th>${t('col_en')}</th>`:''}
    ${!ar ? '<th class="td-dot"></th>' : ''}
    ${!ar && showAr?`<th class="th-ar">${t('col_ar')}</th>`:''}
  </tr></thead><tbody>`;

  const startN = (currentPage-1)*50+1;
  hits.forEach((r,i) => {
    const meta   = RasaifEngine.getMeta(r.src||'');
    const srcLbl = (ar?meta.title_ar:meta.title_en)||r.src||'';
    const rid    = `r${currentPage}_${i}`;
    const rowId  = `row_${currentPage}_${i}`;

    // Nav arrows (shown on hover)
    const navArrows = r.seq ? `
      <div class="row-nav">
        <button class="nav-arrow" title="${ar?'السابق':'Previous'}"
          onclick="navigate('${rowId}','${(r.src||'').replace(/'/g,"\'")}',${r.seq},'up')">▲</button>
        <button class="nav-arrow" title="${ar?'التالي':'Next'}"
          onclick="navigate('${rowId}','${(r.src||'').replace(/'/g,"\'")}',${r.seq},'down')">▼</button>
      </div>` : '';

    // Build English cell
    let enCell = '';
    if (showEn) {
      const {preview,needs} = truncateHTML(r.hlEn||'', PREVIEW);
      enCell = `<td class="td-en">
        <span class="cell-preview" id="${rid}ep">${preview}${needs
          ? ` <button class="cell-expand-btn en" onclick="expandCell('${rid}','e')">&hellip;&thinsp;more</button>`
          : ''}</span>
        ${needs ? `<span id="${rid}ef" style="display:none">${r.hlEn}</span>` : ''}
      </td>`;
    }

    // Build Arabic cell
    let arCell = '';
    if (showAr) {
      const {preview,needs} = truncateHTML(r.hlAr||'', PREVIEW);
      arCell = `<td class="td-ar">
        <span class="cell-preview" id="${rid}ap">${preview}${needs
          ? ` <button class="cell-expand-btn" onclick="expandCell('${rid}','a')">… تتمّته</button>`
          : ''}</span>
        ${needs ? `<span id="${rid}af" style="display:none">${r.hlAr}</span>` : ''}
      </td>`;
    }

    // Swap column order in RTL
    const dotCell = `<td class="td-dot"><span class="align-dot" title="${t('align_tip')}"></span></td>`;
    h += `<tr class="result-row" id="${rowId}">
      <td class="td-n">${startN+i}${navArrows}</td>
      <td class="td-src"><div class="src-title ${ar?'ar':''}">${RasaifEngine.esc(abbr(srcLbl,18))}</div></td>
      ${ar ? arCell + dotCell + enCell : enCell + dotCell + arCell}
    </tr>`;
  });
  return h + '</tbody></table>';
}

/* ── Up/Down navigation ── */
async function navigate(rowId, src, seq, direction) {
  event.stopPropagation();
  const row = document.getElementById(rowId);
  if (!row) return;

  // Remove any existing sibling rows
  const existing = document.getElementById(rowId + '_sib');
  if (existing) { existing.remove(); return; }

  // Show loading placeholder
  const ar = LANG === 'ar';
  const lang = document.getElementById('lang-sel').value;
  const showAr = lang !== 'en';
  const showEn = lang !== 'ar';
  const colSpan = 3 + (showEn?1:0) + (showAr?1:0);
  const loadRow = document.createElement('tr');
  loadRow.id = rowId + '_sib';
  loadRow.className = 'sibling-row';
  loadRow.innerHTML = `<td colspan="${colSpan}">
    <span class="sibling-loading"><span class="spinner"></span> ${ar?'ريثما تُجلى…':'Loading…'}</span>
  </td>`;

  // Insert above or below depending on direction
  if (direction === 'up') {
    row.parentNode.insertBefore(loadRow, row);
  } else {
    row.parentNode.insertBefore(loadRow, row.nextSibling);
  }

  // Fetch the sibling
  const doc = await RasaifEngine.fetchSibling(src, seq, direction);

  if (!doc) {
    loadRow.innerHTML = `<td colspan="${colSpan}" style="color:var(--ink-faint);font-size:11px;padding:6px 9px">
      ${ar ? 'لا يوجد ما قبله' : 'No sentence found'}
    </td>`;
    setTimeout(() => loadRow.remove(), 2000);
    return;
  }

  const meta   = RasaifEngine.getMeta(src);
  const srcLbl = (ar ? meta.title_ar : meta.title_en) || src;
  const {preview:enPrev, needs:enNeeds} = truncateHTML(RasaifEngine.esc(doc.en||''), PREVIEW);
  const {preview:arPrev, needs:arNeeds} = truncateHTML(RasaifEngine.esc(doc.ar||''), PREVIEW);
  const sibId = rowId + '_s';

  const enSib = showEn ? `<td class="td-en">
      <span id="${sibId}ep">${enPrev}${enNeeds
        ? ` <button class="cell-expand-btn en" onclick="expandCell('${sibId}','e')">&hellip;&thinsp;more</button>`
        : ''}</span>
      ${enNeeds ? `<span id="${sibId}ef" style="display:none">${RasaifEngine.esc(doc.en||'')}</span>` : ''}
    </td>` : '';
  const arSib = showAr ? `<td class="td-ar">
      <span id="${sibId}ap">${arPrev}${arNeeds
        ? ` <button class="cell-expand-btn" onclick="expandCell('${sibId}','a')">… تتمّته</button>`
        : ''}</span>
      ${arNeeds ? `<span id="${sibId}af" style="display:none">${RasaifEngine.esc(doc.ar||'')}</span>` : ''}
    </td>` : '';
  const dotSib = `<td class="td-dot"><span class="align-dot"></span></td>`;
  loadRow.innerHTML = `
    <td class="td-n" style="color:var(--ink-faint);font-size:10px">${doc.seq||''}</td>
    <td class="td-src"><div class="src-title ${ar?'ar':''}">${RasaifEngine.esc(abbr(srcLbl,18))}</div></td>
    ${ar ? arSib + dotSib + enSib : enSib + dotSib + arSib}
  `;
}

/* ── Expand a single cell ── */
function expandCell(rid, side) {
  event.stopPropagation();
  const preview = document.getElementById(rid + side + 'p');
  const full    = document.getElementById(rid + side + 'f');
  if (!preview || !full) return;
  preview.style.display = 'none';
  full.style.display    = 'inline';
}

/* ── KWIC ── */
function renderKWIC(lines) {
  if (!lines.length) return `<div class="msg">${t('no_results')}</div>`;
  return '<div class="conc-list">'+lines.map(l=>`
    <div class="conc-item">
      <div class="conc-meta">
        <span>${RasaifEngine.esc(RasaifEngine.getMeta(l.src)[LANG==='ar'?'title_ar':'title_en']||l.src)}</span>
      </div>
      <div class="conc-en">
        <span class="conc-left ${l.lang==='ar'?'td-ar':''}">${RasaifEngine.esc(l.pre)}</span>
        <span class="conc-kw">${RasaifEngine.esc(l.kw)}</span>
        <span class="conc-right ${l.lang==='ar'?'td-ar':''}">${RasaifEngine.esc(l.post)}</span>
      </div>
    </div>`).join('')+'</div>';
}

/* ── Pagination ── */
function renderPagination(total, totalPages, current) {
  if (totalPages<=1) { document.getElementById('pagination').innerHTML=''; return; }
  const ar=LANG==='ar';
  let h=`<div class="pag-inner">`;
  h+=`<button class="pag-btn" onclick="goToPage(${current-1})" ${current<=1?'disabled':''}>${ar?'→ السابق':'← Prev'}</button>`;
  const s=Math.max(1,current-3), e=Math.min(totalPages,current+3);
  if(s>1) h+=`<button class="pag-btn" onclick="goToPage(1)">1</button>`;
  if(s>2) h+=`<span class="pag-ellipsis">…</span>`;
  for(let p=s;p<=e;p++) h+=`<button class="pag-btn ${p===current?'active':''}" onclick="goToPage(${p})">${p}</button>`;
  if(e<totalPages-1) h+=`<span class="pag-ellipsis">…</span>`;
  if(e<totalPages) h+=`<button class="pag-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
  h+=`<button class="pag-btn" onclick="goToPage(${current+1})" ${current>=totalPages?'disabled':''}>${ar?'← التالي':'Next →'}</button>`;
  h+=`<span class="pag-info">${ar?'صفحة':'Page'} ${current} ${ar?'من':'of'} ${totalPages}</span>`;
  h+=`</div>`;
  document.getElementById('pagination').innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}

function abbr(s,n) { return s&&s.length>n?s.slice(0,n-1)+'…':s||''; }

init();
</script>
