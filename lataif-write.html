<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>كتابة اللطائف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,600;1,8..60,300&family=Scheherazade+New:wght@400;600&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<style>
body { background: var(--paper); }
.write-wrap { max-width: 860px; margin: 0 auto; padding: 28px 22px 80px; }

.write-title {
  font-family: var(--arabic);
  font-size: 1.4rem;
  font-weight: normal;
  margin-bottom: 1.5rem;
  color: var(--ink);
}

/* ── Toolbar ── */
.write-toolbar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  padding: 8px 10px;
  background: var(--paper-2);
  border: 1px solid var(--rule-strong);
  border-radius: var(--r);
}
.tb-btn {
  font-family: var(--serif);
  font-size: 11px;
  padding: 3px 9px;
  border: 1px solid var(--rule-strong);
  background: var(--paper);
  color: var(--ink-mid);
  cursor: pointer;
  border-radius: var(--r);
  white-space: nowrap;
}
.tb-btn:hover { background: var(--paper-3); }
.tb-sep { width: 1px; background: var(--rule-strong); margin: 2px 3px; }

/* ── Fields ── */
.field-group { margin-bottom: 14px; }
.field-label {
  font-family: var(--arabic);
  font-size: 12px;
  color: var(--ink-soft);
  display: block;
  margin-bottom: 4px;
}
.field-input, .field-textarea {
  width: 100%;
  font-family: var(--arabic);
  font-size: 15px;
  padding: 7px 10px;
  border: 1px solid var(--rule-strong);
  background: var(--paper);
  color: var(--ink);
  border-radius: var(--r);
  outline: none;
  line-height: 1.7;
}
.field-input:focus, .field-textarea:focus { border-color: var(--gold); }
.field-textarea {
  min-height: 320px;
  resize: vertical;
  direction: rtl;
}

/* ── Post list in admin ── */
.admin-posts {
  margin-top: 2rem;
  border-top: 2px solid var(--rule-strong);
  padding-top: 1.5rem;
}
.admin-post-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
}
.admin-post-title {
  flex: 1;
  font-family: var(--arabic);
  font-size: 14px;
  color: var(--ink-mid);
}
.admin-post-date {
  font-size: 10px;
  color: var(--ink-faint);
  font-family: var(--mono);
  white-space: nowrap;
}
.admin-btn {
  font-size: 11px;
  padding: 2px 8px;
  border: 1px solid var(--rule-strong);
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: var(--r);
}
.admin-btn.del { color: #c0392b; border-color: #c0392b; }
.admin-btn:hover { background: var(--paper-3); }

/* ── Upload section ── */
.upload-section {
  margin-top: 2rem;
  padding: 16px;
  border: 1px dashed var(--rule-strong);
  border-radius: var(--rm);
  background: var(--paper-2);
}
.upload-title {
  font-family: var(--arabic);
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 10px;
}
.upload-drop {
  border: 2px dashed var(--gold-light);
  border-radius: var(--r);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  font-family: var(--arabic);
  font-size: 13px;
  color: var(--ink-faint);
  transition: background .1s;
}
.upload-drop:hover, .upload-drop.drag { background: var(--gold-pale); }
.upload-drop input { display: none; }

/* ── Status messages ── */
.status-msg {
  padding: 8px 12px;
  border-radius: var(--r);
  font-family: var(--arabic);
  font-size: 13px;
  margin: 10px 0;
  display: none;
}
.status-msg.ok  { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
.status-msg.err { background: #fce4e4; color: #c0392b; border: 1px solid #ef9a9a; }
.status-msg.show { display: block; }

/* ── Preview ── */
.preview-panel {
  display: none;
  margin-top: 1rem;
  padding: 16px;
  border: 1px solid var(--rule-strong);
  border-radius: var(--rm);
  background: var(--paper);
}
.preview-panel.show { display: block; }
.preview-body {
  font-family: var(--arabic);
  font-size: 16px;
  line-height: 2.1;
  color: var(--ink-mid);
}
.preview-body p { margin-bottom: .8rem; }
.preview-body h2 {
  font-size: 13px; font-weight: bold;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 3px; margin: 1rem 0 .6rem;
}
.corpus-pair { border: 1px solid var(--rule-strong); border-radius: var(--rm);
  background: var(--paper-2); margin: 1rem 0; overflow: hidden; }
.corpus-pair-en { padding: 8px 12px; font-family: var(--serif); font-size: 12px;
  color: var(--ink-mid); border-bottom: 1px solid var(--rule); direction: ltr; text-align: left; }
.corpus-pair-ar { padding: 8px 12px; font-family: var(--arabic); font-size: 14px; line-height: 1.9; }
.corpus-pair-src { padding: 3px 12px; font-size: 10px; color: var(--ink-faint);
  font-family: var(--mono); background: var(--paper-3); direction: ltr; text-align: left; }
</style>
</head>
<body class="rtl">

<header class="site-header">
  <div class="header-inner">
    <a class="site-brand" href="index.html">
      <span class="site-name">الرَّصائف</span>
    </a>
    <nav class="site-nav">
      <a href="lataif.html" class="nav-link">← لطائف الرصائف</a>
    </nav>
  </div>
</header>

<div class="write-wrap">
  <h1 class="write-title">✦ كتابة لطيفة جديدة</h1>

  <!-- Status -->
  <div class="status-msg" id="status-msg"></div>

  <!-- Toolbar -->
  <div class="write-toolbar">
    <button class="tb-btn" onclick="insertMd('**','**')">غامق</button>
    <button class="tb-btn" onclick="insertMd('*','*')">مائل</button>
    <button class="tb-btn" onclick="insertMd('## ','')">عنوان</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="insertPair()">زوج من الرصائف</button>
    <button class="tb-btn" onclick="insertTable()">جدول</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="togglePreview()">معاينة</button>
    <button class="tb-btn" onclick="clearForm()" style="color:var(--ink-faint)">مسح</button>
  </div>

  <!-- Form -->
  <div class="field-group">
    <label class="field-label">عنوان اللطيفة</label>
    <input type="text" class="field-input" id="f-title" placeholder="اكتب عنوان اللطيفة هنا…">
  </div>

  <div class="field-group">
    <label class="field-label">
      نص اللطيفة
      <span style="font-size:10px;color:var(--ink-faint);margin-right:8px">
        لإدراج زوج من الرصائف: [[الإنجليزية || العربية || المصدر]]
      </span>
    </label>
    <textarea class="field-textarea" id="f-body"
      placeholder="اكتب لطيفتك هنا…&#10;&#10;يمكنك استخدام:&#10;## عنوان فرعي&#10;**نص غامق**&#10;[[English text || النص العربي || اسم الكتاب]]&#10;| عمود | عمود |&#10;| --- | --- |&#10;| قيمة | قيمة |"></textarea>
  </div>

  <!-- Preview -->
  <div class="preview-panel" id="preview-panel">
    <div style="font-size:11px;color:var(--ink-faint);margin-bottom:8px;font-family:var(--mono)">معاينة</div>
    <div class="preview-body" id="preview-body"></div>
  </div>

  <div style="display:flex;gap:10px;margin-top:12px">
    <button onclick="savePost()" style="
      font-family:var(--arabic);font-size:14px;padding:8px 20px;
      background:var(--ink);color:var(--paper);border:none;
      border-radius:var(--r);cursor:pointer;">
      نشر اللطيفة
    </button>
    <button onclick="savePost(true)" style="
      font-family:var(--arabic);font-size:14px;padding:8px 20px;
      background:var(--paper);color:var(--ink-mid);
      border:1px solid var(--rule-strong);
      border-radius:var(--r);cursor:pointer;">
      حفظ مسودة
    </button>
  </div>

  <!-- Upload Word file -->
  <div class="upload-section" style="margin-top:2.5rem">
    <div class="upload-title">رفع لطائف من ملف Word</div>
    <p style="font-family:var(--arabic);font-size:12px;color:var(--ink-faint);margin-bottom:10px;line-height:1.8">
      ملف واحد = لطيفة واحدة: السطر الأول هو العنوان، والباقي هو النص.<br>
      ملف بلطائف متعددة: افصل بينها بسطر فيه ثلاث نجوم فقط: <strong>***</strong>
    </p>
    <div class="upload-drop" id="upload-drop"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="handleDrop(event)"
      onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" accept=".docx,.doc" onchange="handleFile(this.files[0])">
      اسحب ملف Word هنا أو انقر للاختيار
    </div>
    <div class="status-msg" id="upload-status"></div>
  </div>

  <!-- Existing posts -->
  <div class="admin-posts">
    <div style="font-family:var(--arabic);font-size:13px;color:var(--ink-soft);margin-bottom:12px;font-weight:bold">
      اللطائف المنشورة
    </div>
    <div id="admin-post-list">
      <div style="color:var(--ink-faint);font-family:var(--arabic);font-size:13px">جارٍ التحميل…</div>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://rasaif-search.ahmed-hs-alghamdi.workers.dev';
const SECRET = 'secretgateofwriting';
let editingId = null;
let allPosts  = [];

/* ── Check secret in URL ── */
if (!window.location.pathname.includes('secretgateofwriting')) {
  document.body.innerHTML = '<div style="text-align:center;padding:80px;font-family:serif;color:#999">Not found</div>';
}

/* ── Load existing posts ── */
async function loadAdminPosts() {
  try {
    const r = await fetch(`${WORKER}/lataif`);
    const data = await r.json();
    allPosts = (data.posts || []).sort((a,b) => new Date(b.date)-new Date(a.date));
    renderAdminList();
  } catch(e) {
    allPosts = [];
    renderAdminList();
  }
}

function renderAdminList() {
  const el = document.getElementById('admin-post-list');
  if (!allPosts.length) {
    el.innerHTML = '<div style="color:var(--ink-faint);font-family:var(--arabic);font-size:13px">لا لطائف بعد.</div>';
    return;
  }
  el.innerHTML = allPosts.map((p,i) => `
    <div class="admin-post-item">
      <div class="admin-post-title">${esc(p.title)}</div>
      <div class="admin-post-date">${new Date(p.date).toLocaleDateString()}</div>
      <button class="admin-btn" onclick="editPost(${i})">تعديل</button>
      <button class="admin-btn del" onclick="deletePost('${p.id}')">حذف</button>
    </div>
  `).join('');
}

/* ── Save post ── */
async function savePost(draft=false) {
  const title = document.getElementById('f-title').value.trim();
  const body  = document.getElementById('f-body').value.trim();
  if (!title) { showStatus('يرجى كتابة عنوان اللطيفة', 'err'); return; }
  if (!body)  { showStatus('يرجى كتابة نص اللطيفة', 'err'); return; }

  const post = {
    id:    editingId || `latifa_${Date.now()}`,
    title,
    body,
    date:  new Date().toISOString(),
    draft: draft
  };

  try {
    const r = await fetch(`${WORKER}/lataif`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Lataif-Secret': SECRET },
      body: JSON.stringify(post)
    });
    if (!r.ok) throw new Error(await r.text());
    showStatus(draft ? 'حُفظت المسودة' : 'نُشرت اللطيفة ✓', 'ok');
    clearForm();
    await loadAdminPosts();
  } catch(e) {
    // Fallback: save to localStorage
    const posts = JSON.parse(localStorage.getItem('rasaif_lataif') || '[]');
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) posts[idx] = post; else posts.unshift(post);
    localStorage.setItem('rasaif_lataif', JSON.stringify(posts));
    showStatus('حُفظ محلياً (لا اتصال بالخادم)', 'ok');
    allPosts = posts;
    renderAdminList();
    clearForm();
  }
}

/* ── Edit post ── */
function editPost(i) {
  const p = allPosts[i];
  editingId = p.id;
  document.getElementById('f-title').value = p.title;
  document.getElementById('f-body').value  = p.body;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  showStatus('تعديل: ' + p.title, 'ok');
}

/* ── Delete post ── */
async function deletePost(id) {
  if (!confirm('هل تريد حذف هذه اللطيفة؟')) return;
  try {
    await fetch(`${WORKER}/lataif/${id}`, {
      method: 'DELETE',
      headers: { 'X-Lataif-Secret': SECRET }
    });
  } catch(e) {}
  // Also remove from localStorage
  const posts = JSON.parse(localStorage.getItem('rasaif_lataif') || '[]');
  localStorage.setItem('rasaif_lataif', JSON.stringify(posts.filter(p => p.id !== id)));
  await loadAdminPosts();
}

/* ── Word file upload ── */
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-drop').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
}

async function handleFile(file) {
  if (!file) return;
  showUploadStatus('جارٍ قراءة الملف…', 'ok');

  // We use the Anthropic API to extract text from the Word file
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 4000,
          messages: [{
            role: 'user',
            content: [{
              type: 'document',
              source: { type: 'base64', media_type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', data: base64 }
            }, {
              type: 'text',
              text: `Extract the text from this Word document and return it as JSON only, no markdown.
If it contains ONE post: {"posts": [{"title": "...", "body": "..."}]}
If it contains MULTIPLE posts separated by ***: {"posts": [{"title": "...", "body": "..."}, ...]}
The first line of each post is the title. Preserve all Arabic text exactly. Return JSON only.`
            }]
          }]
        })
      });
      const data = await response.json();
      const text = data.content?.[0]?.text || '';
      const clean = text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(clean);
      const posts = parsed.posts || [];

      if (!posts.length) { showUploadStatus('لم يُعثر على لطائف في الملف', 'err'); return; }

      if (posts.length === 1) {
        // Load into editor
        document.getElementById('f-title').value = posts[0].title || '';
        document.getElementById('f-body').value  = posts[0].body  || '';
        showUploadStatus(`تمّ تحميل لطيفة واحدة — راجعها وانشرها`, 'ok');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        // Save all directly
        for (const p of posts) {
          const post = { id: `latifa_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
            title: p.title, body: p.body, date: new Date().toISOString(), draft: false };
          try {
            await fetch(`${WORKER}/lataif`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Lataif-Secret': SECRET },
              body: JSON.stringify(post)
            });
          } catch(e) {
            const local = JSON.parse(localStorage.getItem('rasaif_lataif') || '[]');
            local.unshift(post);
            localStorage.setItem('rasaif_lataif', JSON.stringify(local));
          }
        }
        showUploadStatus(`نُشرت ${posts.length} لطائف`, 'ok');
        await loadAdminPosts();
      }
    } catch(e) {
      showUploadStatus('خطأ في قراءة الملف: ' + e.message, 'err');
    }
  };
  reader.readAsDataURL(file);
}

/* ── Toolbar helpers ── */
function insertMd(before, after) {
  const ta = document.getElementById('f-body');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e) || 'نص';
  ta.value = ta.value.slice(0,s) + before + sel + after + ta.value.slice(e);
  ta.focus();
}
function insertPair() {
  insertMd('\n[[', ' || النص العربي || اسم الكتاب]]\n');
}
function insertTable() {
  const t = '\n| عمود 1 | عمود 2 | عمود 3 |\n| --- | --- | --- |\n| قيمة | قيمة | قيمة |\n';
  const ta = document.getElementById('f-body');
  const s = ta.selectionStart;
  ta.value = ta.value.slice(0,s) + t + ta.value.slice(s);
}
function togglePreview() {
  const panel = document.getElementById('preview-panel');
  const body  = document.getElementById('f-body').value;
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) {
    document.getElementById('preview-body').innerHTML = renderBody(body);
  }
}
function clearForm() {
  editingId = null;
  document.getElementById('f-title').value = '';
  document.getElementById('f-body').value  = '';
  document.getElementById('preview-panel').classList.remove('show');
}

/* ── Render body (same as public page) ── */
function renderBody(body) {
  if (!body) return '';
  let html = esc(body);
  html = html.replace(/\[\[(.+?)\|\|(.+?)\|\|(.+?)\]\]/g, (_,en,ar,src) => `
    <div class="corpus-pair">
      <div class="corpus-pair-en">${en.trim()}</div>
      <div class="corpus-pair-ar">${ar.trim()}</div>
      <div class="corpus-pair-src">${src.trim()}</div>
    </div>`);
  html = html.replace(/(\|.+\|\n?)+/g, block => {
    const rows = block.trim().split('\n').filter(r=>r.trim());
    let table = '<table style="width:100%;border-collapse:collapse;margin:1rem 0">';
    rows.forEach((row,i) => {
      if (row.match(/^\|[-\s|]+\|$/)) return;
      const cells = row.split('|').slice(1,-1).map(c=>c.trim());
      if (i===0) table += '<tr>'+cells.map(c=>`<th style="padding:5px 8px;border-bottom:2px solid var(--rule-strong);text-align:right">${c}</th>`).join('')+'</tr>';
      else table += '<tr>'+cells.map(c=>`<td style="padding:5px 8px;border-bottom:1px solid var(--rule)">${c}</td>`).join('')+'</tr>';
    });
    return table+'</table>';
  });
  html = html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  html = html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g,'<em>$1</em>');
  html = html.split(/\n\n+/).map(p=>p.trim()?`<p>${p.replace(/\n/g,' ')}</p>`:'').join('');
  return html;
}

/* ── Status helpers ── */
function showStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = `status-msg ${type} show`;
  setTimeout(() => el.classList.remove('show'), 4000);
}
function showUploadStatus(msg, type) {
  const el = document.getElementById('upload-status');
  el.textContent = msg;
  el.className = `status-msg ${type} show`;
}
function esc(t) {
  return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadAdminPosts();
</script>
</body>
</html>
