<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Raṣāʾif — Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,600;1,8..60,300&family=Scheherazade+New:wght@400;600&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="site-brand" href="index.html">
      <span class="site-name" id="hd-name">Raṣāʾif</span>
      <span class="site-tagline" id="hd-tag">Arabic–English Parallel Corpus</span>
    </a>
    <nav class="site-nav">
      <a href="index.html"     class="nav-link"        id="nav-s">Search</a>
      <a href="analysis.html"  class="nav-link active" id="nav-a">Analysis</a>
      <a href="about.html"     class="nav-link"        id="nav-b">About</a>
      <a href="cite.html"      class="nav-link"        id="nav-c">Cite</a>
      <a href="aranjiyya.html" class="nav-link"        id="nav-e">al-ʿAranijiyya</a>
      <button class="nav-lang-btn" id="lang-btn" onclick="toggleLang()">العربية</button>
    </nav>
  </div>
</header>

<div class="analysis-layout">
  <aside class="an-sidebar">
    <div class="sb-heading" id="an-sb-lbl">Texts</div>
    <div id="an-book-list">
      <div style="font-size:12px;color:var(--ink-faint);padding:8px">
        <span class="spinner"></span> <span id="an-load-msg">Loading…</span>
      </div>
    </div>
    <div style="margin-top:16px">
      <div class="sb-heading" id="an-lang-lbl">Language</div>
      <div class="btn-group" style="width:100%;margin-top:6px" id="an-lang-btns">
        <button class="active" onclick="setAnLang('en')" id="an-btn-en">English</button>
        <button onclick="setAnLang('ar')" id="an-btn-ar">Arabic</button>
      </div>
    </div>
  </aside>

  <div class="an-main">
    <div id="an-content">
      <div class="msg"><span class="spinner"></span> <span id="an-init-msg">Loading corpus…</span></div>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script>

const WORKER_URL = 'https://rasaif-search.ahmed-hs-alghamdi.workers.dev';
let anLang = 'en';
let selectedBook = 'all';
let allBooks = [];

/* ── Language toggle ── */
function toggleLang() { setLang(LANG === 'en' ? 'ar' : 'en'); applyI18n(); }

function applyI18n() {
  const ar = LANG === 'ar';
  document.getElementById('hd-name').textContent    = t('site_name');
  document.getElementById('hd-tag').textContent     = t('site_subtitle');
  document.getElementById('nav-s').textContent      = t('nav_search');
  document.getElementById('nav-a').textContent      = t('nav_analysis');
  document.getElementById('nav-b').textContent      = t('nav_about');
  document.getElementById('nav-c').textContent      = t('nav_cite');
  document.getElementById('lang-btn').textContent   = t('toggle_lang');
  document.getElementById('an-sb-lbl').textContent  = t('texts_heading');
  document.getElementById('an-lang-lbl').textContent = ar ? 'لغة التحليل' : 'Analysis Language';
  document.getElementById('an-btn-en').textContent  = ar ? 'الإنجليزية' : 'English';
  document.getElementById('an-btn-ar').textContent  = ar ? 'العربية' : 'Arabic';
  renderAnSidebar();
}

/* ── Init ── */
async function init() {
  setLang(LANG);
  applyI18n();
  try {
    await RasaifEngine.loadBooks(msg => {
      document.getElementById('an-load-msg').textContent = msg;
    });
    allBooks = RasaifEngine.books();
    renderAnSidebar();
    await renderAnalysis();
  } catch(e) {
    document.getElementById('an-content').innerHTML =
      `<div class="msg">${e.message}</div>`;
  }
}

function setAnLang(l) {
  anLang = l;
  document.querySelectorAll('#an-lang-btns button').forEach((b, i) =>
    b.classList.toggle('active', ['en','ar'][i] === l)
  );
  renderAnalysis();
}

/* ── Sidebar ── */
function renderAnSidebar() {
  const books = RasaifEngine.books();
  if (!books.length) return;
  const ar = LANG === 'ar';
  let html = `<label class="text-item" onclick="selectBook('all')" style="cursor:pointer">
    <input type="radio" name="anbook" value="all" ${selectedBook==='all'?'checked':''}>
    <div class="text-item-text">
      <div class="text-item-title ${ar?'ar':''}">${ar?'جميع النصوص':'All texts'}</div>
    </div>
  </label>`;
  books.forEach(b => {
    const m = b.meta;
    const title = ar ? m.title_ar : m.title_en;
    html += `<label class="text-item" onclick="selectBook('${b.name}')" style="cursor:pointer">
      <input type="radio" name="anbook" value="${b.name}" ${selectedBook===b.name?'checked':''}>
      <div class="text-item-text">
        <div class="text-item-title ${ar?'ar':''}">${RasaifEngine.esc(title)}</div>
        <div class="text-item-date">${RasaifEngine.esc(ar?m.death_label_ar:m.death_label_en)}</div>
      </div>
    </label>`;
  });
  document.getElementById('an-book-list').innerHTML = html;
}

function selectBook(name) {
  selectedBook = name;
  renderAnSidebar();
  renderAnalysis();
}

/* ── Fetch stats from Typesense ── */
async function fetchStats(bookFilter) {
  try {
    // Get total count
    const url = new URL(WORKER_URL);
    url.searchParams.set('q', '*');
    url.searchParams.set('per_page', '0');
    url.searchParams.set('facet_by', 'source');
    if (bookFilter && bookFilter !== 'all') {
      url.searchParams.set('filter_by', `source:[\`${bookFilter}\`]`);
    }
    const r = await fetch(url.toString());
    const data = await r.json();
    return {
      total: data.found || 0,
      facets: data.facet_counts?.[0]?.counts || []
    };
  } catch(e) {
    return { total: 0, facets: [] };
  }
}

/* ── Main analysis render ── */
async function renderAnalysis() {
  const ar = LANG === 'ar';
  document.getElementById('an-content').innerHTML =
    `<div class="msg"><span class="spinner"></span> ${ar?'جارٍ التحليل…':'Analysing…'}</div>`;

  const stats = await fetchStats(selectedBook);
  const books = RasaifEngine.books();
  const bookName = selectedBook === 'all'
    ? (ar ? 'جميع النصوص' : 'All texts')
    : RasaifEngine.getMeta(selectedBook)[ar ? 'title_ar' : 'title_en'];

  let html = `<h1 class="an-title ${ar?'ar':''}">${RasaifEngine.esc(bookName)}</h1>`;

  /* ── Corpus overview ── */
  html += `<div class="section">
    <h2>${ar ? 'إحصاءُ الخزانة' : 'Corpus Overview'}</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-val">${stats.total.toLocaleString()}</div>
        <div class="stat-lbl ${ar?'ar':''}">${ar?'أزواجُ الجمل':'Sentence Pairs'}</div>
      </div>
      <div class="stat-box">
        <div class="stat-val">${selectedBook==='all' ? books.length : 1}</div>
        <div class="stat-lbl ${ar?'ar':''}">${ar?'النصوص':'Texts'}</div>
      </div>
      <div class="stat-box">
        <div class="stat-val">${anLang === 'en' ? 'EN' : 'AR'}</div>
        <div class="stat-lbl ${ar?'ar':''}">${ar?'لغة التحليل':'Analysis language'}</div>
      </div>
    </div>
  </div>`;

  /* ── Texts breakdown (only for all) ── */
  if (selectedBook === 'all' && stats.facets.length) {
    html += `<div class="section">
      <h2>${ar ? 'توزيعُ الأزواج على النصوص' : 'Sentence Pairs by Text'}</h2>
      <table class="freq-table">
        <thead><tr>
          <th>${ar?'الكتاب':'Text'}</th>
          <th>${ar?'المؤلف':'Author'}</th>
          <th>${ar?'التاريخ':'Date'}</th>
          <th class="td-r">${ar?'الأزواج':'Pairs'}</th>
          <th class="td-r">${ar?'النسبة':'Share'}</th>
          <th class="bar-cell"></th>
        </tr></thead><tbody>`;

    const sorted = [...stats.facets].sort((a, b) => {
      const ma = RasaifEngine.getMeta(a.value);
      const mb = RasaifEngine.getMeta(b.value);
      return ma.death_ah - mb.death_ah;
    });

    const maxCount = Math.max(...sorted.map(f => f.count));
    sorted.forEach(f => {
      const m = RasaifEngine.getMeta(f.value);
      const title  = ar ? m.title_ar  : m.title_en;
      const author = ar ? m.author_ar : m.author_en;
      const date   = ar ? m.death_label_ar : m.death_label_en;
      const pct    = ((f.count / stats.total) * 100).toFixed(1);
      const bw     = Math.round((f.count / maxCount) * 120);
      html += `<tr>
        <td class="${ar?'td-ar-word':''}">${RasaifEngine.esc(title)}</td>
        <td class="${ar?'td-ar-word':''}" style="font-size:11px">${RasaifEngine.esc(author)}</td>
        <td style="font-size:11px;color:var(--ink-faint)">${RasaifEngine.esc(date)}</td>
        <td class="td-r">${f.count.toLocaleString()}</td>
        <td class="td-r">${pct}%</td>
        <td class="bar-cell"><span class="bar" style="width:${bw}px"></span></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  /* ── Note about deeper analysis ── */
  html += `<div class="section">
    <h2>${ar?'ملاحظة':'Note'}</h2>
    <p class="note ${ar?'ar':''}" style="font-size:13px;color:var(--ink-mid);line-height:1.8">
      ${ar
        ? 'يعتمد التحليل المعمَّق — من إحصاء الكلم وتواترها واستخراج المتواردات — على تحميل النصوص كاملةً. وقد صار البرنامج يعتمد على قاعدة بيانات مركزية لتسريع التفتيش؛ ومن ثَمَّ فإن هذه الوظائف ستُتاح في إصدار قادم.'
        : 'Deep analysis features — word frequency, collocations, n-grams — require loading the full texts locally. Since this corpus now uses a centralised search database for speed, these features will be available in a future update. Use the Search page for full-text queries across all texts.'
      }
    </p>
  </div>`;

  document.getElementById('an-content').innerHTML = html;
}

init();
</script>
</body>
</html>
